        <section class="page-heading">
          <h1>实用工具箱</h1>
          <p>全站在线工具合集，按用途分类：计算、日历、场景组合与实用小工具，打开即用、无需下载。想快速找到某个工具，可用顶部的搜索。</p>
        </section>

        <div id="toolsGroups"></div>

        <div class="info-box mt-4"><span aria-hidden="true">🧰</span><div>共收录计算器、日历工具、场景组合、其他工具等 35 个功能页，全部免费、无登录、无广告干扰核心计算。工具会持续更新。</div></div>

        <script>
        (function () {
          function boot() {
            var TOOLS = window.__TOOLS__ || [];
            var ORDER = [['calc', '计算器'], ['cal', '日历工具'], ['combo', '场景组合'], ['other', '其他工具']];
            var byKey = {};
            TOOLS.forEach(function (t) { (byKey[t.key] = byKey[t.key] || []).push(t); });
            var html = ORDER.map(function (g) {
              var items = byKey[g[0]] || [];
              if (!items.length) return '';
              var cards = items.map(function (t) {
                var icon = '<span class="tool-card-icon"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-' + (t.icon || 'tool') + '"></use></svg></span>';
                return '<a class="tool-card" href="' + t.url + '">' + icon + '<span class="tool-card-title">' + t.label + '</span>' + (t.desc ? '<span class="tool-card-desc">' + t.desc + '</span>' : '') + '</a>';
              }).join('');
              return '<section class="home-section" data-cat="' + g[0] + '"><h2 class="section-title"><span class="dot" aria-hidden="true"></span>' + g[1] + '<span class="count">' + items.length + '</span></h2><div class="tool-grid">' + cards + '</div></section>';
            }).filter(Boolean).join('');
            document.getElementById('toolsGroups').innerHTML = html;
            if (window.U) U.track('tool_open', { tool: 'tools' });
          }
          if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
        })();
        </script>
