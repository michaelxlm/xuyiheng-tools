        <section class="page-heading">
          <h1>搜索工具</h1>
          <p>输入关键词，快速找到全站在线工具。支持按名称、用途搜索，无需回车即可实时筛选。</p>
        </section>

        <div class="card">
          <div class="search-bar">
            <svg class="ico search-ic" aria-hidden="true" focusable="false"><use href="#i-search"></use></svg>
            <input class="form-input" id="searchInput" type="search" placeholder="搜索：个税、房贷、万年历、BMI、汇率…" autocomplete="off" aria-label="搜索工具">
            <button class="btn btn-secondary" type="button" id="searchClear" hidden>清除</button>
          </div>
          <div class="hot-words" id="hotWords"></div>
        </div>

        <div class="search-meta" id="searchMeta">共收录 <b id="searchCount">--</b> 个工具</div>
        <div class="tool-grid" id="searchResults"></div>
        <div class="card search-empty" id="searchEmpty" hidden>
          <svg class="ico empty-ico" aria-hidden="true" focusable="false"><use href="#i-search"></use></svg>
          <p>没有找到匹配的工具，换个关键词试试。</p>
        </div>

        <div class="info-box mt-4"><span aria-hidden="true">💡</span><div>搜索在本页浏览器内即时匹配，不经过服务器，保护隐私。</div></div>

        <script>
        (function () {
          function boot() {
            var TOOLS = window.__TOOLS__ || [];
            var $ = function (id) { return document.getElementById(id); };
            $('searchCount').textContent = TOOLS.length;
            var HOT = ['个税', '房贷', '万年历', 'BMI', '汇率', '字数', '配速', '倒计时'];
            $('hotWords').innerHTML = HOT.map(function (w) { return '<button type="button" class="chip" data-w="' + w + '">' + w + '</button>'; }).join('');

            function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
            function hl(text, q) { if (!q) return esc(text); var i = text.toLowerCase().indexOf(q.toLowerCase()); if (i < 0) return esc(text); return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length)); }
            function render(q) {
              q = (q || '').trim();
              var list = q ? TOOLS.filter(function (x) { return (x.label + (x.desc || '') + x.cat).toLowerCase().indexOf(q.toLowerCase()) >= 0; }) : TOOLS;
              $('searchEmpty').hidden = list.length > 0;
              $('searchResults').innerHTML = list.map(function (x) {
                var icon = '<span class="tool-card-icon"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-' + (x.icon || 'tool') + '"></use></svg></span>';
                return '<a class="tool-card" href="' + x.url + '">' + icon + '<span class="tool-card-title">' + hl(x.label, q) + '</span>' + (x.desc ? '<span class="tool-card-desc">' + hl(x.desc, q) + '</span>' : '') + '</a>';
              }).join('');
              $('searchClear').hidden = !q;
            }
            $('searchInput').addEventListener('input', function () { render(this.value); });
            $('searchClear').addEventListener('click', function () { $('searchInput').value = ''; render(''); $('searchInput').focus(); });
            Array.prototype.slice.call(document.querySelectorAll('#hotWords .chip')).forEach(function (b) {
              b.addEventListener('click', function () { $('searchInput').value = b.getAttribute('data-w'); render(b.getAttribute('data-w')); });
            });
            var q0 = new URLSearchParams(location.search).get('q') || '';
            if (q0) { $('searchInput').value = q0; }
            render(q0);
            if (window.U) U.track('tool_open', { tool: 'search' });
          }
          if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
        })();
        </script>
