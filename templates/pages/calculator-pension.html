        <section class="page-heading">
          <h1>养老金计算器</h1>
          <p>按现行职工基本养老金计发办法，估算退休后的月养老金：基础养老金 + 个人账户养老金两部分，帮助规划缴费年限与退休生活质量。</p>
        </section>

        <form class="card" id="pgForm">
          <div class="form-group"><label class="form-label" for="pg-social">退休时上年度社平工资</label><div class="input-with-unit"><input class="form-input" id="pg-social" type="number" inputmode="decimal" min="0" placeholder="如 8000"><span class="unit-tag">元/月</span></div></div>
          <div class="form-row">
            <div class="form-group"><label class="form-label" for="pg-years">累计缴费年限</label><div class="input-with-unit"><input class="form-input" id="pg-years" type="number" inputmode="decimal" min="1" placeholder="如 25"><span class="unit-tag">年</span></div></div>
            <div class="form-group"><label class="form-label" for="pg-index">平均缴费指数（0.6~3）</label><input class="form-input" id="pg-index" type="number" inputmode="decimal" min="0.6" max="3" step="0.1" value="1"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label" for="pg-account">个人账户储存额</label><div class="input-with-unit"><input class="form-input" id="pg-account" type="number" inputmode="decimal" min="0" placeholder="如 150000"><span class="unit-tag">元</span></div></div>
            <div class="form-group"><label class="form-label" for="pg-age">退休年龄</label><select class="form-select" id="pg-age"><option value="139">60 岁</option><option value="170">55 岁</option><option value="195">50 岁</option></select></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-primary" type="submit" data-track="calc_click" data-track-props='{"tool":"pension"}'>估算养老金</button>
          </div>
        </form>

        <div class="result-box" id="pg-result" hidden>
          <div class="result-row"><div><div class="result-label">预计月养老金</div><div class="result-value" id="pg-total">--</div></div></div>
          <dl class="result-detail" id="pg-detail"></dl>
        </div>

        <div class="info-box mt-4"><span>ℹ️</span><div>基础养老金 = 社平 ×（1 + 缴费指数）÷ 2 × 缴费年限 × 1%；个人账户养老金 = 个人账户储存额 ÷ 计发月数（60 岁 139 / 55 岁 170 / 50 岁 195）。未含过渡性养老金，实际以社保经办核算为准。</div></div>

        <script>
        (function () {
          function boot() {
            var U = window.U; if (!U) return;
            var $ = function (id) { return document.getElementById(id); };
            function row(k, v) { return '<div class="result-detail-row"><dt>' + k + '</dt><dd>' + v + '</dd></div>'; }
            $('pgForm').addEventListener('submit', function (e) {
              e.preventDefault();
              var social = U.numInput($('pg-social')), years = U.numInput($('pg-years')), idx = U.numInput($('pg-index')), acct = U.numInput($('pg-account')), months = Number($('pg-age').value);
              if (!(social > 0 && years > 0)) { alert('请填写社平工资与缴费年限'); return; }
              if (!Number.isFinite(idx) || idx <= 0) idx = 1;
              if (!Number.isFinite(acct) || acct < 0) acct = 0;
              var basic = social * (1 + idx) / 2 * years * 0.01;
              var personal = acct / months;
              var total = basic + personal;
              $('pg-total').textContent = U.money(total) + ' /月';
              $('pg-detail').innerHTML =
                row('基础养老金', U.money(basic)) +
                row('个人账户养老金', U.money(personal) + '（÷ ' + months + ' 个月）') +
                row('年领金额', U.money(total * 12));
              $('pg-result').hidden = false;
              U.track('calc_result', { tool: 'pension' });
            });
          }
          if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
        })();
        </script>
