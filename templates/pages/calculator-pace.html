        <section class="page-heading">
          <h1>跑步配速计算器</h1>
          <p>三种互算模式：由距离与用时求配速、由距离与目标配速预算完赛时间、由用时与配速反推距离，支持 mm:ss 或 hh:mm:ss 输入。</p>
        </section>

        <form class="card" id="paceForm">
          <div class="form-group">
            <label class="form-label" for="pace-mode">计算模式</label>
            <select class="form-select" id="pace-mode">
              <option value="topace">距离 + 用时 → 配速</option>
              <option value="totime">距离 + 配速 → 完赛时间</option>
              <option value="todist">用时 + 配速 → 距离</option>
            </select>
          </div>
          <div class="form-group"><label class="form-label" for="pace-dist">距离</label><div class="input-with-unit"><input class="form-input" id="pace-dist" type="number" inputmode="decimal" min="0" placeholder="如 5"><span class="unit-tag">公里</span></div></div>
          <div class="form-group"><label class="form-label" for="pace-time">总用时</label><input class="form-input" id="pace-time" type="text" placeholder="如 25:00 或 1:05:30"></div>
          <div class="form-group"><label class="form-label" for="pace-pace">目标配速</label><input class="form-input" id="pace-pace" type="text" placeholder="如 5:00（每公里分:秒）"></div>
          <div class="btn-row">
            <button class="btn btn-primary" type="submit" data-track="calc_click" data-track-props='{"tool":"pace"}'>计算</button>
          </div>
        </form>

        <div class="result-box" id="pace-result" hidden>
          <div class="result-row"><div><div class="result-label" id="pace-rlabel">结果</div><div class="result-value" id="pace-rvalue">--</div></div></div>
          <dl class="result-detail" id="pace-detail"></dl>
        </div>

        <div class="info-box mt-4"><span>ℹ️</span><div>配速指跑完每公里所需时间（分:秒）。时速 = 60 ÷ 每公里分钟数。半程马拉松按 21.0975 公里、全程按 42.195 公里计算。</div></div>

        <script>
        (function () {
          function boot() {
            var U = window.U; if (!U) return;
            var $ = function (id) { return document.getElementById(id); };
            function row(k, v) { return '<div class="result-detail-row"><dt>' + k + '</dt><dd>' + v + '</dd></div>'; }
            function parseTime(s) {
              s = String(s || '').trim(); if (!s) return NaN;
              var p = s.split(':').map(function (x) { return Number(x); });
              if (p.some(function (x) { return !Number.isFinite(x) || x < 0; })) return NaN;
              if (p.length === 2) return p[0] * 60 + p[1];
              if (p.length === 3) return p[0] * 3600 + p[1] * 60 + p[2];
              return Number(s) * 60; // 纯数字按分钟
            }
            function fmtSec(sec) {
              sec = Math.round(sec);
              var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
              var pad = function (x) { return (x < 10 ? '0' : '') + x; };
              return h > 0 ? h + ':' + pad(m) + ':' + pad(s) : m + ':' + pad(s);
            }
            var fields = { dist: $('pace-dist'), time: $('pace-time'), pace: $('pace-pace') };
            function grp(el) { return el.closest('.form-group'); }
            function syncMode() {
              var m = $('pace-mode').value;
              grp(fields.dist).hidden = (m === 'todist');
              grp(fields.time).hidden = (m === 'totime');
              grp(fields.pace).hidden = (m === 'topace');
            }
            $('pace-mode').addEventListener('change', syncMode); syncMode();
            $('paceForm').addEventListener('submit', function (e) {
              e.preventDefault();
              var m = $('pace-mode').value, out = '', label = '', detail = '';
              if (m === 'topace') {
                var d = U.numInput($('pace-dist')), t = parseTime($('pace-time').value);
                if (!(d > 0) || !Number.isFinite(t) || t <= 0) { alert('请输入距离与用时'); return; }
                var perKm = t / d;
                label = '平均配速'; out = fmtSec(perKm) + ' /公里';
                detail = row('时速', U.round(3600 * d / t, 2) + ' km/h') + row('总用时', fmtSec(t)) + row('每 100 米', U.round(perKm / 10, 1) + ' 秒');
              } else if (m === 'totime') {
                var d2 = U.numInput($('pace-dist')), ps = parseTime($('pace-pace').value);
                if (!(d2 > 0) || !Number.isFinite(ps) || ps <= 0) { alert('请输入距离与配速'); return; }
                label = '预计完赛时间'; out = fmtSec(d2 * ps);
                detail = row('距离', d2 + ' 公里') + row('配速', fmtSec(ps) + ' /公里') + row('时速', U.round(3600 / ps, 2) + ' km/h');
              } else {
                var t3 = parseTime($('pace-time').value), ps3 = parseTime($('pace-pace').value);
                if (!Number.isFinite(t3) || t3 <= 0 || !Number.isFinite(ps3) || ps3 <= 0) { alert('请输入用时与配速'); return; }
                label = '可跑距离'; out = U.round(t3 / ps3, 2) + ' 公里';
                detail = row('用时', fmtSec(t3)) + row('配速', fmtSec(ps3) + ' /公里');
              }
              $('pace-rlabel').textContent = label; $('pace-rvalue').textContent = out;
              $('pace-detail').innerHTML = detail; $('pace-result').hidden = false;
              U.track('calc_result', { tool: 'pace', mode: m });
            });
          }
          if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
        })();
        </script>
