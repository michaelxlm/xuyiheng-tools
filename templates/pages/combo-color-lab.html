        <section class="page-heading">
          <h1>色彩研究所</h1>
          <p>探索色彩的魅力：任选基准色一键生成协调配色方案（互补/类比/三角/分裂互补），浏览中国传统色，还有趣味颜色性格测试。前端设计、配色灵感一站取用。</p>
        </section>

        <div class="chips" role="tablist">
          <button type="button" class="chip active" data-tab="scheme" role="tab">🎨 配色方案</button>
          <button type="button" class="chip" data-tab="cn" role="tab">🏮 传统色彩</button>
          <button type="button" class="chip" data-tab="psy" role="tab">🧠 颜色性格</button>
        </div>

        <form class="card" id="scForm">
          <div class="form-row">
            <div class="form-group"><label class="form-label" for="sc-color">基准色</label><input class="form-color" id="sc-color" type="color" value="#2563eb"></div>
            <div class="form-group"><label class="form-label" for="sc-mode">配色类型</label><select class="form-select" id="sc-mode">
              <option value="complement">互补色</option>
              <option value="analogous">类比色</option>
              <option value="triadic">三角配色</option>
              <option value="split">分裂互补</option>
              <option value="shades">同色深浅</option>
            </select></div>
          </div>
          <div class="btn-row"><button class="btn btn-primary" type="submit" data-track="calc_click" data-track-props='{"tool":"color-lab","mode":"scheme"}'>生成配色</button></div>
        </form>

        <div class="card" id="cnPanel" hidden>
          <p style="margin:0 0 var(--space-3);color:var(--color-muted)">点击色块复制色值。中国传统色取自经典色谱，感受东方美学。</p>
          <div class="swatch-grid" id="cn-grid"></div>
        </div>

        <form class="card" id="psyPanel" hidden>
          <div class="form-group"><label class="form-label">凭直觉，选一个最吸引你的颜色</label>
            <div class="swatch-grid" id="psy-grid"></div>
          </div>
        </form>

        <div class="result-box" id="cl-result" hidden>
          <div class="result-row"><div><div class="result-label" id="cl-rlabel">配色方案</div><div id="cl-palette" class="palette"></div></div></div>
          <dl class="result-detail" id="cl-detail"></dl>
        </div>

        <div class="info-box mt-4"><span>🎨</span><div>配色基于 HSL 色轮：互补为相对 180°、类比为相邻 ±30°、三角互为 120°、分裂互补取互补两侧 ±150°。颜色性格测试为趣味内容，仅供娱乐。</div></div>

        <style>
        .form-color { width: 100%; height: 44px; padding: 4px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); cursor: pointer; }
        .swatch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: var(--space-2); }
        .swatch { border-radius: var(--radius-sm); padding: var(--space-4) var(--space-2) var(--space-2); color: #fff; text-align: center; cursor: pointer; font-size: var(--text-sm); text-shadow: 0 1px 2px rgba(0,0,0,.35); transition: transform var(--dur-fast) var(--ease); }
        .swatch:hover { transform: translateY(-2px); }
        .swatch b { display: block; font-weight: 600; }
        .palette { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-2); }
        .palette span { flex: 1 1 72px; min-width: 72px; height: 60px; border-radius: var(--radius-sm); display: flex; align-items: flex-end; justify-content: center; font-size: 11px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); padding-bottom: 4px; }
        </style>

        <script>
        (function () {
          function boot() {
            var U = window.U; if (!U) return;
            var $ = function (id) { return document.getElementById(id); };
            function row(k, v) { return '<div class="result-detail-row"><dt>' + k + '</dt><dd>' + v + '</dd></div>'; }
            function hex2hsl(hex) {
              var n = parseInt(hex.slice(1), 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
              var mx = Math.max(r, g, b), mn = Math.min(r, g, b), h = 0, s = 0, l = (mx + mn) / 2, d = mx - mn;
              if (d) {
                s = d / (1 - Math.abs(2 * l - 1));
                if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
                h *= 60; if (h < 0) h += 360;
              }
              return [h, s * 100, l * 100];
            }
            function hsl2hex(h, s, l) {
              s /= 100; l /= 100; var k = function (n) { return (n + h / 30) % 12; };
              var a = s * Math.min(l, 1 - l);
              var f = function (n) { var c = l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); return Math.round(255 * c).toString(16).padStart(2, '0'); };
              return '#' + f(0) + f(8) + f(4);
            }
            var PANELS = { scheme: 'scForm', cn: 'cnPanel', psy: 'psyPanel' };
            U.qsa('[data-tab]').forEach(function (b) { b.addEventListener('click', function () {
              U.qsa('[data-tab]').forEach(function (x) { x.classList.remove('active'); }); b.classList.add('active');
              var t = b.getAttribute('data-tab'); Object.keys(PANELS).forEach(function (k) { $(PANELS[k]).hidden = k !== t; });
              $('cl-result').hidden = t !== 'scheme';
            }); });
            function gen() {
              var hex = $('sc-color').value, m = $('sc-mode').value, hsl = hex2hsl(hex), h = hsl[0], s = hsl[1], l = hsl[2];
              var colors = [];
              if (m === 'complement') colors = [hex, hsl2hex((h + 180) % 360, s, l)];
              else if (m === 'analogous') colors = [hsl2hex((h + 330) % 360, s, l), hex, hsl2hex((h + 30) % 360, s, l)];
              else if (m === 'triadic') colors = [hex, hsl2hex((h + 120) % 360, s, l), hsl2hex((h + 240) % 360, s, l)];
              else if (m === 'split') colors = [hex, hsl2hex((h + 150) % 360, s, l), hsl2hex((h + 210) % 360, s, l)];
              else colors = [.35, .6, 1, 1.25, 1.5].map(function (f) { return hsl2hex(h, s, Math.min(96, l * f)); });
              var names = { complement: '互补色', analogous: '类比色', triadic: '三角配色', split: '分裂互补', shades: '同色深浅' };
              $('cl-rlabel').textContent = names[m] + '（基准 ' + hex.toUpperCase() + '）';
              $('cl-palette').innerHTML = colors.map(function (c) { return '<span style="background:' + c + '">' + c.toUpperCase() + '</span>'; }).join('');
              $('cl-detail').innerHTML = row('色相 H', U.round(h, 0) + '°') + row('饱和度 S', U.round(s, 0) + '%') + row('亮度 L', U.round(l, 0) + '%') + row('色块数量', colors.length + ' 个（点击方案色块可复制）');
              $('cl-result').hidden = false;
              U.qsa('#cl-palette span').forEach(function (el) { el.addEventListener('click', function () { copy(el.textContent); }); });
              U.track('calc_result', { tool: 'color-lab', mode: 'scheme', scheme: m });
            }
            function copy(text) {
              text = (text || '').trim(); if (!text || !navigator.clipboard) return;
              navigator.clipboard.writeText(text).then(function () { try { U.track('color_copy', { color: text }); } catch (e) {} }).catch(function () {});
            }
            $('scForm').addEventListener('submit', function (e) { e.preventDefault(); gen(); });
            $('sc-mode').addEventListener('change', function () { if (!$('cl-result').hidden) gen(); });
            gen();
            var CN = [['天青','#aebdc2','雨过天晴云破处'],['月白','#d6ecf0','淡蓝近月'],['朱砂','#ff4a3f','正红矿物'],['胭脂','#9d2933','深红妆色'],['青瓷','#74d0c1','瓷釉青绿'],['鹅黄','#fff3a0','淡黄如鹅'],['缃叶','#f0c929','浅黄丝色'],['黛紫','#4a3742','青黑带紫'],['松花','#66996e','松花绿'],['胭脂水','#e87e72','粉中带红']];
            CN = CN.filter(function (c) { return /^#[0-9a-f]{6}$/i.test(c[1]); });
            $('cn-grid').innerHTML = CN.map(function (c) { return '<div class="swatch" style="background:' + c[1] + '" data-hex="' + c[1] + '" title="' + c[2] + '"><b>' + c[0] + '</b>' + c[1].toUpperCase() + '</div>'; }).join('');
            U.qsa('#cn-grid .swatch').forEach(function (el) { el.addEventListener('click', function () { copy(el.getAttribute('data-hex')); flash(el); }); });
            function flash(el) { var o = el.style.outline; el.style.outline = '3px solid var(--color-primary)'; setTimeout(function () { el.style.outline = o; }, 400); }
            var PSY = [['#e74c3c','热情','#2ecc71'],['#3498db','理性','#9b59b6'],['#f1c40f','乐观','#e67e22'],['#9b59b6','神秘','#8e44ad'],['#1abc9c','平和','#16a085']];
            var PTEXT = { '#e74c3c': '你充满活力与行动力，敢于追求，是天生的点燃者。', '#3498db': '你冷静理性、善于思考，重视逻辑与深度。', '#f1c40f': '你乐观开朗、富有创意，是人群中的小太阳。', '#9b59b6': '你富有想象力与直觉，独特而感性，追求精神世界。', '#1abc9c': '你温和包容、追求平衡，善于倾听，是可靠的港湾。' };
            $('psy-grid').innerHTML = PSY.map(function (p) { return '<div class="swatch" style="background:' + p[0] + '" data-k="' + p[0] + '"><b>' + p[1] + '</b>选择</div>'; }).join('');
            U.qsa('#psy-grid .swatch').forEach(function (el) { el.addEventListener('click', function () {
              var k = el.getAttribute('data-k');
              $('cl-rlabel').textContent = '你的颜色性格 · ' + el.querySelector('b').textContent;
              $('cl-palette').innerHTML = '<span style="background:' + k + '">' + k.toUpperCase() + '</span>';
              $('cl-detail').innerHTML = row('解读', PTEXT[k] || '');
              $('cl-result').hidden = false;
              U.track('calc_result', { tool: 'color-lab', mode: 'psy', color: k });
            }); });
          }
          if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
        })();
        </script>
