name: Deploy xuyiheng-tools

on:
  push:
    branches: [main]
    paths-ignore:
      - '.workbuddy/**'
      - '.idea/**'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-xuyiheng-tools
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'michaelxlm/xuyiheng-tools'
    runs-on: [self-hosted, linux, x64, static-deploy]
    timeout-minutes: 30
    steps:
      - name: Configure SSH for GitHub checkout
        shell: bash
        run: |
          git config --system url."git@github.com:".insteadOf "https://github.com/"
          mkdir -p /root/.ssh && chmod 700 /root/.ssh
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> /root/.ssh/known_hosts 2>/dev/null

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1
      - name: "Install @xuyiheng/static-build-kit (WO-164 ④ private file: dep)"
        shell: bash
        env:
          HOME: /root
        run: |
          # 克隆 packages 单源仓到工作区兄弟目录，npm ci 建立 file: 依赖软链
          # （node_modules/@xuyiheng/static-build-kit -> ../packages/static-build-kit）
          TOP="$(dirname "$GITHUB_WORKSPACE")"
          rm -rf "$TOP/packages"
          git clone --depth 1 git@github.com:michaelxlm/packages.git "$TOP/packages"
          export PATH="/www/server/nodejs/v20.18.3/bin:$PATH"
          cd "$GITHUB_WORKSPACE"
          npm ci --no-audit --no-fund

      - name: Encoding gate
        shell: bash
        run: |
          NODE=/www/server/nodejs/v20.18.3/bin/node
          [ -x "$NODE" ] || NODE=node
          $NODE scripts/check-encoding.js

      - name: WCAG gate (brand contrast)
        shell: bash
        run: |
          # 样式审计 T4：品牌主色反色字对比度 ≥4.5:1 + 载体不得用未验证辅助色
          NODE=/www/server/nodejs/v20.18.3/bin/node
          [ -x "$NODE" ] || NODE=node
          $NODE scripts/check-wcag.js

      - name: Build
        shell: bash
        run: |
          NODE=/www/server/nodejs/v20.18.3/bin/node
          [ -x "$NODE" ] || NODE=node
          $NODE scripts/build.js
          $NODE scripts/check-links.js

      - name: Apply unified site shell (footer / about / ads / cross-links)
        shell: bash
        run: |
          # 展示层统一规范：build.js（含 prerender/fingerprint/check-links）之后的最后一步
          NODE=/www/server/nodejs/v20.18.3/bin/node
          [ -x "$NODE" ] || NODE=node
          $NODE scripts/apply-site-shell.js
          $NODE scripts/apply-site-shell.js --check
      - name: Sync to /www/wwwroot/uni-web
        shell: bash
        run: |
          set -o pipefail
          tar cf - --exclude=.git --exclude=.github --exclude=.user.ini --exclude=node_modules --exclude=package-lock.json . | ssh -i /root/.ssh/admin.xuyiheng.com_id_ed25519 -o StrictHostKeyChecking=accept-new root@39.107.225.222 "mkdir -p /www/wwwroot/uni-web ; cd /www/wwwroot/uni-web ; tar xmf -"
      - name: Apply nginx 403 hardening (fail-safe)
        continue-on-error: true
        shell: bash
        run: |
          # 片段已随 sync 落到站点目录；脚本自带 nginx -t 校验与失败回滚。
          # GSC「由于禁止访问 (403) 而被屏蔽」来自旧目录式 URL 打在 autoindex off 的目录上。
          ssh -i /root/.ssh/admin.xuyiheng.com_id_ed25519 -o StrictHostKeyChecking=accept-new \
            root@39.107.225.222 'bash -s' < deploy/apply-nginx-hardening.sh
      - name: Verify no 403 on legacy directory URLs
        shell: bash
        run: |
          set -u
          # 这些是 GSC 403 的高发路径；任何 403 都视为回归。
          for path in / /robots.txt /calculator/ /calculator/tax/ /calendar/ /assets/ /data/ /scripts/ /package.json; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
              -A 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)' \
              "https://xuyiheng.com$path") || code=000
            echo "$path -> $code"
            if [ "$code" = "403" ]; then echo "::error::$path 仍返回 403"; exit 1; fi
          done
