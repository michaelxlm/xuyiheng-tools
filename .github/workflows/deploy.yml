name: Deploy xuyiheng-tools

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, static-deploy]
    steps:
      - name: Configure SSH for GitHub checkout
        shell: bash
        run: |
          git config --system url."git@github.com:".insteadOf "https://github.com/"
          mkdir -p /root/.ssh && chmod 700 /root/.ssh
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> /root/.ssh/known_hosts 2>/dev/null

      - uses: actions/checkout@v4
      - name: "Install @xuyiheng/static-build-kit (WO-164 ④ private file: dep)"
        shell: bash
        env:
          HOME: /root
        run: |
          # 克隆 packages 单源仓到工作区兄弟目录，npm ci 建立 file: 依赖软链
          # （node_modules/@xuyiheng/static-build-kit -> ../packages/static-build-kit）
          TOP="$(dirname "$GITHUB_WORKSPACE")"
          rm -rf "$TOP/packages"
          git clone --depth 1 git@github.com:michaelxlm/packages.git "$TOP/packages"
          export PATH="/www/server/nodejs/v20.18.3/bin:$PATH"
          cd "$GITHUB_WORKSPACE"
          npm ci --no-audit --no-fund

      - name: Encoding gate
        shell: bash
        run: |
          NODE=/www/server/nodejs/v20.18.3/bin/node
          [ -x "$NODE" ] || NODE=node
          $NODE scripts/check-encoding.js

      - name: WCAG gate (brand contrast)
        shell: bash
        run: |
          # 样式审计 T4：品牌主色反色字对比度 ≥4.5:1 + 载体不得用未验证辅助色
          NODE=/www/server/nodejs/v20.18.3/bin/node
          [ -x "$NODE" ] || NODE=node
          $NODE scripts/check-wcag.js

      - name: Build
        shell: bash
        run: |
          NODE=/www/server/nodejs/v20.18.3/bin/node
          [ -x "$NODE" ] || NODE=node
          $NODE scripts/build.js
          $NODE scripts/check-links.js

      - name: Sync to /www/wwwroot/uni-web
        shell: bash
        run: |
          tar cf - --exclude=.git --exclude=.github --exclude=.user.ini --exclude=node_modules --exclude=package-lock.json . | ssh -i /root/.ssh/admin.xuyiheng.com_id_ed25519 -o StrictHostKeyChecking=accept-new root@39.107.225.222 "mkdir -p /www/wwwroot/uni-web ; cd /www/wwwroot/uni-web ; tar xmf -"
