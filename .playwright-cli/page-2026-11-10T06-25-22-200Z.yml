          - heading "关于一珩成长笔记" [level=1] [ref=f6e87]
          - paragraph [ref=f6e88]: 一珩成长笔记是一个纯实用的在线工具站，把日常工作与生活中高频用到的计算、查询、日历与生活工具聚合到一起，打开即用、无需下载、无需注册。
        - generic [ref=f6e89]:
          - heading "我们做什么" [level=2] [ref=f6e90]
          - paragraph [ref=f6e91]:
            - text: 站点围绕「省时间、算清楚」这一目标，提供数十个功能页，覆盖：
            - link "计算器" [ref=f6e92] [cursor=pointer]:
              - /url: /tools.html
            - text: （个税、房贷、五险一金、单位换算、日期、配速、体脂等）、
            - link "日历工具" [ref=f6e93] [cursor=pointer]:
              - /url: /calendar.html
            - text: （万年历老黄历、今日指南、倒计时纪念日）、
            - link "场景组合" [ref=f6e94] [cursor=pointer]:
              - /url: /combo/buy-house.html
            - text: （买房买车、健康体检、理财百宝箱、人生规划）以及概率、随机数、视力自测等实用小工具。
          - heading "我们的原则" [level=2] [ref=f6e95]
          - list [ref=f6e96]:
            - listitem [ref=f6e97]: 免费开放：核心计算功能全部免费，无需注册登录即可使用。
            - listitem [ref=f6e98]: 即开即用：纯静态页面，加载快，手机、平板、电脑自适应，无需安装任何 App。
            - listitem [ref=f6e99]: 数据在本地：像倒计时、视力自测等涉及个人记录的功能，数据仅保存在你自己的浏览器，不上传服务器。
            - listitem [ref=f6e100]: 理性参考：健康、运势、彩票、黄历等内容仅供娱乐或筛查参考，不构成医疗、投资或专业建议。
          - heading "关于数据与隐私" [level=2] [ref=f6e101]
          - paragraph [ref=f6e102]:
            - text: 本站采用无登录态设计，不收集账号、身份等个人信息；仅通过匿名方式统计页面访问量与功能使用情况，用于改进产品。详细说明请见
            - link "隐私政策" [ref=f6e103] [cursor=pointer]:
              - /url: /privacy.html
            - text: 。
          - heading "免责声明" [level=2] [ref=f6e104]
          - paragraph [ref=f6e105]: 工具结果基于公开通用公式与接口数据，力求准确但可能存在偏差，重大决策请以官方、专业机构的结论为准。部分实时数据（如汇率、IP 归属地、黄历宜忌）依赖第三方接口，接口不可用时相应功能会降级或暂时不可用。
