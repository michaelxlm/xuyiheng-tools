        - generic [ref=f9e86]:
          - heading "隐私政策" [level=1] [ref=f9e87]
          - paragraph [ref=f9e88]: 本政策说明一珩成长笔记（xuyiheng.com，下称「本站」）在使用工具过程中如何收集、使用、存储与保护信息。本站为无登录态的纯工具站，整体设计遵循「最小必要」原则。
        - generic [ref=f9e89]:
          - heading "一、不收集的信息" [level=2] [ref=f9e90]
          - list [ref=f9e91]:
            - listitem [ref=f9e92]: 本站无需注册与登录，不设「我的」账户体系，不收集姓名、手机号、邮箱、密码等身份账号信息。
            - listitem [ref=f9e93]: 你在计算器中输入的数值（工资、房贷金额、身高体重、生日等）仅在你自己的浏览器本地处理与计算，默认不上传、不留存。
          - heading "二、本地存储（localStorage）" [level=2] [ref=f9e94]
          - paragraph [ref=f9e95]: 为提供连续体验，部分功能会使用浏览器本地存储：
          - list [ref=f9e96]:
            - listitem [ref=f9e97]: 主题偏好：记录你选择的亮/暗色主题。
            - listitem [ref=f9e98]: 个人记录：如「重要日子·倒计时」中你添加的纪念日，仅保存在本地设备，不会同步到服务器。
            - listitem [ref=f9e99]: 匿名访客标识：用于统计去重的随机 ID，不含任何个人身份信息。
          - paragraph [ref=f9e100]: 你可以随时通过浏览器的「清除站点数据/缓存」删除上述本地信息，删除后相关记录将不可恢复。
          - heading "三、匿名使用统计" [level=2] [ref=f9e101]
          - paragraph [ref=f9e102]: 本站通过埋点采集匿名的页面访问（PV）与功能使用事件（如某计算器的点击、结果生成），用于了解哪些工具有价值、优化产品体验。统计不与你的真实身份关联，也不用于个性化广告画像。
          - heading "四、第三方服务" [level=2] [ref=f9e103]
          - list [ref=f9e104]:
            - listitem [ref=f9e105]: 数据接口：汇率、IP 归属地、黄历宜忌、星座运势等实时内容，由本站中台接口提供，请求仅包含必要参数（如查询的 IP、日期、星座），不含个人身份信息。
            - listitem [ref=f9e106]: 广告与优惠券位：部分页面展示广告位/优惠券位，其内容来自第三方配置。第三方可能使用 Cookie 等技术，其数据处理遵循各自的隐私政策。
          - heading "五、未成年人保护" [level=2] [ref=f9e107]
          - paragraph [ref=f9e108]: 本站为通用工具站，不面向儿童收集任何个人信息。请监护人引导未成年人合理使用，健康、运势、彩票等功能仅供娱乐参考。
          - heading "六、政策更新" [level=2] [ref=f9e109]
          - paragraph [ref=f9e110]: 本站可能适时修订本政策，修订后将在此页面更新生效日期。继续使用即表示你接受更新后的政策。如有疑问，可通过站内信息与我们联系。
          - paragraph [ref=f9e111]: 最近更新：本政策自发布之日起生效。
