# 审核P0修复：Soft 404 - 不存在路径返回真实404状态码（原SPA兜底/index.html改为=404）
error_page 404 /404.html;

# 2026-11-19 GSC 404 修复：旧 URL 301 归一到显式 .html
# 旧 uni-app H5 首页/发现/我的
location = /pages/index/index       { return 301 /; }
location = /pages/discover/discover { return 301 /discover.html; }
location = /pages/ucenter/ucenter   { return 301 /; }
location ~ ^/pages(/|$)             { return 301 /; }

# 旧 H5 分包路由：能对应新工具页的 301 到具体 .html，无对应页回首页
location ~ ^/pages_event/(?<h5>.+)$ {
    set $h5_target /$h5.html;
    if ($h5 = "calendar/index") { set $h5_target /calendar.html; }
    if ($h5 = "calendar/countdown-anniversary") { set $h5_target /calendar/countdown.html; }
    if ($h5 = "dynamicVisualAcuity/dynamicVisualAcuity") { set $h5_target /vision.html; }
    if ($h5 = "probability/index") { set $h5_target /probability.html; }
    if ($h5 = "tools/navigation") { set $h5_target /tools.html; }
    if ($h5 = "tools/color-tool") { set $h5_target /combo/color-lab.html; }

    if (-f "${document_root}${h5_target}") {
        return 301 ${h5_target}$is_args$args;
    }
    return 301 /;
}

location / {
    # 旧目录式 / 无扩展名 URL → 显式 .html
    set $legacy_target $uri;
    if ($uri ~ "^(?<legacy>.+)/$") { set $legacy_target $legacy; }
    if ($uri = /) { set $legacy_target ""; }
    if ($uri = /combo/) { set $legacy_target /combo/index; }

    if (-f "${document_root}${legacy_target}.html") {
        return 301 ${legacy_target}.html$is_args$args;
    }

    try_files $uri $uri/index.html =404;
}
