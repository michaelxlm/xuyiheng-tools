# =============================================================================
# nginx-index-hardening.conf · xuyiheng.com GSC 403 归一片段
# 用途：粘进 xuyiheng.com 的 server { } 内（或宝塔 extension/xuyiheng.com/），
#       与 deploy/nginx.conf、deploy/rewrite-html_xuyiheng.com.conf 共存；
#       改完 nginx -t && nginx -s reload。
#
# 背景（GSC 2026-11-12 邮件「由于禁止访问 (403) 而被屏蔽了」）：
#   首页/内容页 Googlebot UA 均 200；裸目录 URL 打在 autoindex off 的目录上
#   返回 403，目录内文件反而可读。GSC 把 403 判成「已屏蔽，无法编入索引」。
#   本片段只处理裸目录：统一 404，彻底消除 403。
#   旧目录式内容 URL（/calculator/tax/ 等）的 301 归一已由
#   deploy/nginx.conf / rewrite-html_xuyiheng.com.conf 负责，此处不重复定义，
#   避免正则 location 抢走它们的存在性检查逻辑。
#
# 注意：
#   1) 不重复定义 ACME location，避免与基线配置的 ^~ /.well-known/acme-challenge/
#      冲突导致 nginx -t duplicate location；隐藏文件正则用否定预查放行它。
#   2) 不要在本片段里定义 error_page / location = /404.html；
#      基线配置已有真 404，重复定义会让 nginx -t 失败。
# =============================================================================

# 裸目录：404，不再 403
location = /calculator/ { return 404; }
location = /assets/     { return 404; }
location = /data/       { return 404; }
location = /scripts/    { return 404; }
location = /templates/  { return 404; }
location = /deploy/     { return 404; }
location = /reports/    { return 404; }

# 隐藏文件/目录（.git、.user.ini 等）：404，不再 403；ACME 校验路径除外
location ~ /\.(?!well-known/) { return 404; }
