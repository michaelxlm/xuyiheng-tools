# ==========================================================================
# xuyiheng.com · Nginx 部署配置
# 用法：另存为 /etc/nginx/conf.d/xuyiheng.com.conf，改下面 3 处后 nginx -t && nginx -s reload
#   1) root      站点目录
#   2) server_name 与证书路径
#   3) 如需对象存储 / CDN，本文件不适用
#
# 2026-11-09 审核问题修复：
#   - P0 Soft 404：不存在页面返回 200 + 首页内容 → error_page 404 + try_files =404
#   - P1 www 未 301 → 裸域：www server 块 return 301
#   - P1 缺安全头 → 统一基线 6 项
#   - P1 无 Cache-Control → HTML no-cache + assets 长缓存
# ==========================================================================

# ------------------------------- HTTP → HTTPS ------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name xuyiheng.com www.xuyiheng.com;

    # 证书申请用的校验目录要放行
    location ^~ /.well-known/acme-challenge/ { root /var/www/xuyiheng-tools; }

    location / { return 301 https://xuyiheng.com$request_uri; }
}

# ----------------------- HTTPS · www → 裸域（必须 301）----------------------
server {
    listen 443 ssl;
    http2 on;
    server_name www.xuyiheng.com;

    ssl_certificate     /etc/letsencrypt/live/xuyiheng.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xuyiheng.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://xuyiheng.com$request_uri;
}

# ---------------------------------- HTTPS ----------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name xuyiheng.com;

    root /var/www/xuyiheng-tools;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/xuyiheng.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xuyiheng.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # ------------------------------ 安全响应头（统一基线 6 项） ------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), browsing-topics=(), autoplay=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://2002cs.com https://fangkelianmeng.com https://xuliming.com https://xuyiheng.com https://585.ink https://20101115.com https://zangeng.com https://coupon.zangeng.com https://img.fangkelianmeng.com https://store.fangkelianmeng.com" always;

    # ------------------------------ 压缩 ------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml text/xml;

    # ------------------------------ 缓存策略 ------------------------------
    # HTML 不缓存：改版立刻生效，且 404 页不会被缓存成 200
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        # nginx add_header 继承规则：location 内有 add_header 会覆盖 server 层全部头
        # 因此这里必须同步复制安全头，否则 HTML 响应会丢失 6 项安全头
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), browsing-topics=(), autoplay=()" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://2002cs.com https://fangkelianmeng.com https://xuliming.com https://xuyiheng.com https://585.ink https://20101115.com https://zangeng.com https://coupon.zangeng.com https://img.fangkelianmeng.com https://store.fangkelianmeng.com" always;
    }

    # assets/ 长缓存：文件名带 ?v=build_version
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # JSON 必须显式声明类型
    location ~* \.json$ {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
    }

    # ------------------------------ 不该被访问的目录 ------------------------------
    location ^~ /data/     { return 404; }
    location ^~ /scripts/  { return 404; }
    location ^~ /reports/  { return 404; }
    location = /package.json { return 404; }

    # ------------------------------ 真 404（修复 Soft 404） ------------------------------
    # 返回 404 状态码 + 404.html 内容，避免 soft-404 被搜索引擎收录
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }

    # ------------------------------ 路由 ------------------------------
    # 首页只用目录形式
    location = /index.html { return 301 /; }

    location / {
        try_files $uri $uri/index.html =404;
    }

    # 站点地图不缓存
    location = /sitemap.xml { add_header Cache-Control "no-cache" always; }
    location = /robots.txt  { add_header Cache-Control "no-cache" always; }

    access_log /var/log/nginx/xuyiheng.com.access.log;
    error_log  /var/log/nginx/xuyiheng.com.error.log;
}
